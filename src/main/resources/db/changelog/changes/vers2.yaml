databaseChangeLog:
  - changeSet:
      id: 002-courier-profile-and-order-state
      author: ali-abdulov
      changes:
        - addColumn:
            tableName: couriers
            columns:
              - column:
                  name: fin_code
                  type: VARCHAR(7)
              - column:
                  name: birth_date
                  type: DATE
              - column:
                  name: address
                  type: VARCHAR(255)
              - column:
                  name: active_order_id
                  type: VARCHAR(100)
        - addUniqueConstraint:
            tableName: couriers
            columnNames: fin_code
            constraintName: uk_couriers_fin_code
        - addUniqueConstraint:
            tableName: couriers
            columnNames: active_order_id
            constraintName: uk_couriers_active_order
        - createIndex:
            tableName: couriers
            indexName: idx_couriers_status
            columns:
              - column:
                  name: status
        - createTable:
            tableName: courier_orders
            columns:
              - column:
                  name: order_id
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: courier_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: delivered
                  type: BOOLEAN
                  constraints:
                    nullable: false
